<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
<title id="t">Race signals around the start</title>
<desc id="d">Preparatory flags P, I, Z, U and black, and the recall, postponement and abandonment flags X, First Substitute, AP and N.</desc>
<rect x="0.5" y="0.5" width="1279" height="639" rx="16" fill="#ffffff" stroke="#c9d3e0" stroke-width="1"/><text x="40" y="54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#14263f">Race signals around the start</text><text x="40" y="80" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b82">The preparatory flag goes up at 4 minutes. The others are used when a start is recalled, postponed or abandoned.</text><text x="40" y="128" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14263f">Preparatory signal, 4 minutes before the start</text><rect x="60" y="148" width="108" height="108" fill="#2f55a4"/><rect x="94.56" y="182.56" width="38.879999999999995" height="38.879999999999995" fill="#ffffff"/><text x="60" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">P</text><text x="60" y="310" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Preparatory signal</text><text x="60" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: one sound, down: one long sound</text><rect x="305" y="148" width="108" height="108" fill="#fde100" stroke="#9aa7b8" stroke-width="1"/><circle cx="359.0" cy="202.0" r="22.68" fill="#111"/><text x="305" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">I</text><text x="305" y="310" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Rule 30.1</text><text x="305" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: one sound, down: one long sound</text><polygon points="550,148 658,148 604.0,202.0" fill="#fde100" stroke-linejoin="round" stroke-linecap="round"/><polygon points="550,148 604.0,202.0 550,256" fill="#111" stroke-linejoin="round" stroke-linecap="round"/><polygon points="658,148 658,256 604.0,202.0" fill="#2f55a4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="550,256 658,256 604.0,202.0" fill="#e4252b" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">Z</text><text x="550" y="310" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Rule 30.2</text><text x="550" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: one sound, down: one long sound</text><rect x="795" y="148" width="108" height="108" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/><rect x="795" y="148" width="54.0" height="54.0" fill="#e4252b"/><rect x="849.0" y="202.0" width="54.0" height="54.0" fill="#e4252b"/><text x="795" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">U</text><text x="795" y="310" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Rule 30.3</text><text x="795" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: one sound, down: one long sound</text><rect x="1040" y="148" width="108" height="108" fill="#111"/><text x="1040" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">Black flag</text><text x="1040" y="310" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Rule 30.4</text><text x="1040" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: one sound, down: one long sound</text><line x1="40" y1="366" x2="1240" y2="366" stroke="#c9d3e0" stroke-width="1" stroke-linecap="round"/><text x="40" y="402" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14263f">Other signals</text><rect x="60" y="422" width="108" height="108" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/><rect x="104.82" y="422" width="18.360000000000003" height="108" fill="#2f55a4"/><rect x="60" y="466.82" width="108" height="18.360000000000003" fill="#2f55a4"/><text x="60" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">X</text><text x="60" y="584" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Individual recall</text><text x="60" y="604" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: one sound</text><polygon points="305,442.52 461.6,476.0 305,509.47999999999996" fill="#2f55a4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="305,455.912 370.772,476.0 305,496.08799999999997" fill="#fde100" stroke-linejoin="round" stroke-linecap="round"/><text x="305" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">First Substitute</text><text x="305" y="584" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">General recall</text><text x="305" y="604" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: two sounds, down: one</text><clipPath id="apclip"><polygon points="550,440.36 706.6,463.1696 706.6,488.8304 550,511.64" fill="#000" stroke-linejoin="round" stroke-linecap="round"/></clipPath><g clip-path="url(#apclip)"><rect x="550.0" y="440.36" width="31.82" height="71.28" fill="#e4252b"/><rect x="581.32" y="440.36" width="31.82" height="71.28" fill="#ffffff"/><rect x="612.64" y="440.36" width="31.82" height="71.28" fill="#e4252b"/><rect x="643.96" y="440.36" width="31.82" height="71.28" fill="#ffffff"/><rect x="675.28" y="440.36" width="31.82" height="71.28" fill="#e4252b"/></g><polygon points="550,440.36 706.6,463.1696 706.6,488.8304 550,511.64" fill="none" stroke="#9aa7b8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">AP</text><text x="550" y="584" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Postponement</text><text x="550" y="604" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: two sounds, down: one</text><rect x="795.0" y="422.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="795.0" y="449.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="795.0" y="476.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="795.0" y="503.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="822.0" y="422.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="822.0" y="449.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="822.0" y="476.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="822.0" y="503.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="849.0" y="422.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="849.0" y="449.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="849.0" y="476.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="849.0" y="503.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="876.0" y="422.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="876.0" y="449.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="876.0" y="476.0" width="27.0" height="27.0" fill="#ffffff"/><rect x="876.0" y="503.0" width="27.0" height="27.0" fill="#2f55a4"/><rect x="795" y="422" width="108" height="108" fill="none" stroke="#9aa7b8" stroke-width="1"/><text x="795" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14263f">N</text><text x="795" y="584" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14263f">Abandonment</text><text x="795" y="604" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b82">up: three sounds, down: one</text><text x="1040" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6b82">Sound notation</text><text x="1040" y="472" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82">up: the flag is displayed</text><text x="1040" y="490" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82">down: the flag is removed</text><text x="1040" y="508" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82">After AP, N or First Substitute is</text><text x="1040" y="526" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82">removed, the warning signal follows</text><text x="1040" y="544" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82">one minute later.</text><text x="1240" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b82" text-anchor="end">Flag designs redrawn after the World Sailing Race Signals, RRS 2025-2028</text>
</svg>
