<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 490" width="1280" height="490" role="img" aria-labelledby="t d">
<title id="t">Start sequence timeline</title>
<desc id="d">Timeline from 05:00 to 00:00 with the four horn pulses, the class and preparatory flags and the LED state.</desc>
