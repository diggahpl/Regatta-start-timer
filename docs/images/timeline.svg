t="22" rx="4" fill="#f2711c"/><text x="442.0" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">preparatory flag (P, I, Z, U or black) up</text><text x="1238.0" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b82">down</text><text x="1038.0" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b82">down</text><line x1="230" y1="414" x2="1230" y2="414" stroke="#1f6fb2" stroke-width="9" stroke-dasharray="6 6" stroke-linecap="butt"/><line x1="1230" y1="414" x2="1264" y2="414" stroke="#1f6fb2" stroke-width="9" stroke-linecap="butt"/><text x="730.0" y="440" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">blinks 500 ms on, 500 ms off (not to scale)</text><text x="1247" y="440" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">steady</text><text x="40" y="470" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b82">t = 0 when the release of START is accepted (50 ms debounce). Default pulse lengths 1 s, 1 s, 1 s, 2 s; configurable in Config.h.</text>
</svg>
