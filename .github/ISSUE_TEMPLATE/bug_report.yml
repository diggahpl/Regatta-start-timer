name: Bug report
description: Something does not behave as documented
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - Arduino Nano (new bootloader)
        - Arduino Nano (old bootloader)
        - Arduino Uno R3
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: relay
    attributes:
      label: Relay module and compressor
      description: Module model or marking, trigger level, and how the compressor is switched (directly or through a second relay).
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw on the display, the LED and the relay, and when.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings changed in Config.h
      description: List every option you changed from the defaults, or write "none".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repository version
      description: Commit hash or release tag you built from.
